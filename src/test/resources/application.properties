spring.application.name=banco-del-tiempo-test

# Base de datos independiente para las pruebas
spring.datasource.url=jdbc:h2:mem:banco_del_tiempo_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Las tablas se eliminan al finalizar las pruebas
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=false

